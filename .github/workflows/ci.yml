name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest

      - name: Benchmark smoke test
        run: python scripts/run_bench.py --iters 5 --warmup 2

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build runtime image
        run: docker build --tag edgebench:ci .

      - name: Start container
        run: docker run --detach --name edgebench-ci -p 7860:7860 edgebench:ci

      - name: Wait for healthy container
        run: |
          timeout 120 bash -c 'until [ "$(docker inspect --format="{{.State.Health.Status}}" edgebench-ci)" = "healthy" ]; do sleep 2; done'
          curl --fail --silent --show-error http://localhost:7860/healthz
          curl --fail --silent --show-error http://localhost:7860/NOTICE

      - name: Show container logs on failure
        if: failure()
        run: docker logs edgebench-ci

      - name: Remove container
        if: always()
        run: docker rm --force edgebench-ci
